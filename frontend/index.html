<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FutureSelf</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>FutureSelf</h1>

    <div>
        <h2>Create Account</h2>

        <input
            type="email"
            id="signupEmail"
            placeholder="Email"
        >

        <input
            type="password"
            id="signupPassword"
            placeholder="Password"
        >

        <button id="signupBtn">Sign Up</button>
    </div>


    <div>
        <h2>Login</h2>

        <input
            type="email"
            id="loginEmail"
            placeholder="Email"
        >

        <input
            type="password"
            id="loginPassword"
            placeholder="Password"
        >

        <button id="loginBtn">Login</button>
    </div>
    <div id="profileSection">

    <h2>My Profile</h2>

    <input
        type="text"
        id="usernameInput"
        placeholder="Username"
    >

    <input
        type="text"
        id="fullNameInput"
        placeholder="Full name"
    >

    <button id="saveProfileBtn">Save Profile</button>

</div>
<button id="logoutBtn">Logout</button>
<div id="capsuleSelection">

    <h2>Create a Time Capsule</h2>

    <input
        type="text"
        id="capsuleTitle"
        placeholder="Capsule title"
    >

    <textarea
        id="capsuleMessage"
        placeholder="Write something for your future self..."
        rows="6"
    ></textarea>

    <label for="unlockDate">
        When should this capsule unlock?
    </label>

    <input
        type="datetime-local"
        id="unlockDate"
    >

    <button id="createCapsuleBtn">
        Lock Capsule 🔒
    </button>

</div>

<div id="capsuleStatus"></div>


    <p id="message"></p>
    <div id="myCapsulesSection">

    <h2>My Capsules</h2>

    <div id="capsulesList"></div>

</div>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="script.js"></script>

</body>
</html>
